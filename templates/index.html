<!DOCTYPE html>
<html>
<head>
    <title>FitLife - Home Workout Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>FitLife</h1>

        <p>Ten minutes a day. That's it. No equipment, no gym.</p>

        <p>Fill in the form below to get a workout that matches your fitness level and the time you have available.</p>

        <form action="/today" method="POST">
            <label>Your Name:</label>
            <input type="text" name="user_name" required>

            <label>Age:</label>
            <input type="number" name="age" min="13" max="100" required>

            <label>Fitness Level:</label>
            <select name="level" required>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <label>Minutes Available:</label>
            <input type="number" name="available_minutes" min="5" max="60" required>

            <button type="submit">Get My Workout</button>
        </form>

        <a href="/history">View Workout History</a>
    </div>
</body>
</html>
